[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "backtest-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
]

[tool.setuptools]
py-modules = ["main", "db", "auth"]
