[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "numpy>=1.26",
]
mt5 = [
    "MetaTrader5>=5.0.45",
]

[project.scripts]
run-backtest = "cli:run_backtest"
mt5-fetch = "cli:mt5_fetch"

[tool.setuptools]
packages = ["engine", "data", "strategies"]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
